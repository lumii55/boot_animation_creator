<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Criador de Boot Animations ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            background-color: #121212; color: #ffffff; font-family: 'Fredoka', sans-serif; 
            display: flex; justify-content: center; align-items: flex-start;
            padding: 15px; min-height: 100vh; width: 100vw; overflow-x: hidden; 
        }

        .container { 
            width: 100%; max-width: 450px; display: flex; flex-direction: column; 
            align-items: center; gap: 15px; padding-bottom: 50px;
        }

        h1 { color: #bb86fc; text-align: center; font-size: 22px; margin-top: 10px; }
        p { color: #aaaaaa; text-align: center; font-size: 13px; margin-bottom: 5px; }

        .btn-upload { 
            background-color: #bb86fc; color: #000; padding: 14px 20px; 
            border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; 
            text-align: center; font-size: 15px; transition: 0.2s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-upload:active { transform: scale(0.96); }

        .video-container { position: relative; width: 100%; text-align: center; display: none; }
        video { 
            width: 100%; max-height: 35vh; border-radius: 15px; 
            background-color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            object-fit: contain; cursor: pointer; transition: 0.2s;
        }
        video.pausado { border: 2px solid #03dac6; }
        .dica-video { font-size: 11px; color: #aaaaaa; margin-top: 5px; opacity: 0.8; }

        .timeline-wrapper {
            width: 100%; height: 60px; background: #222; border-radius: 10px;
            position: relative; display: none; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            border: 1px solid #444; overflow: hidden;
        }
        .playhead-centro {
            position: absolute; left: 50%; top: -5px; bottom: -5px; width: 3px;
            background: #fff; z-index: 20; transform: translateX(-50%);
            border-radius: 3px; box-shadow: 0 0 8px rgba(255,255,255,0.8); pointer-events: none;
        }
        .timeline-scroll {
            width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden;
            scroll-behavior: auto; position: relative; cursor: grab;
        }
        .timeline-scroll:active { cursor: grabbing; }
        .timeline-scroll::-webkit-scrollbar { display: none; }
        
        .filmstrip-container { display: flex; height: 100%; width: max-content; }
        .pad-spacer { height: 100%; flex-shrink: 0; }
        
        .filmstrip { 
            display: flex; height: 100%; position: relative; 
            background-color: #111; user-select: none; /* Impede bugar o arraste */
        }
        .filmstrip img { height: 100%; object-fit: cover; opacity: 0.6; pointer-events: none; flex: 1; }
        
        .linha-marcador {
            position: absolute; top: 0; bottom: 0; width: 4px; z-index: 10;
            transform: translateX(-50%); border-radius: 2px; opacity: 0.9;
        }
        .linha-m0 { background: #03dac6; }
        .linha-m1 { background: #bb86fc; }
        .linha-m2 { background: #ffb86c; }
        .linha-m3 { background: #ff5555; }

        .grid-marcadores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; display: none; }
        .btn-marc {
            padding: 12px 5px; border-radius: 12px; font-weight: bold; border: none;
            font-family: 'Fredoka', sans-serif; cursor: pointer; color: #000; font-size: 13px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: 0.2s;
        }
        .btn-marc:active { transform: scale(0.95); }
        .btn-m0 { background-color: #03dac6; }
        .btn-m1 { background-color: #bb86fc; }
        .btn-m2 { background-color: #ffb86c; }
        .btn-m3 { background-color: #ff5555; }
        
        .status-marc { font-size: 11px; display: block; opacity: 0.7; }

        .configuracoes { display: none; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .campo-full { grid-column: span 2; }
        .campo { display: flex; flex-direction: column; }
        .campo label { color: #bb86fc; margin-bottom: 4px; text-align: center; font-size: 13px; font-weight: 700; }
        .campo input, .campo select { 
            background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 10px; 
            border-radius: 10px; text-align: center; font-family: 'Fredoka', sans-serif; 
            font-size: 14px; width: 100%; outline: none;
        }

        .checkbox-container {
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px;
            background: #2a2a2a; border: 1px solid #444; border-radius: 10px; padding: 10px;
        }
        .checkbox-container input[type="checkbox"] {
            width: 20px; height: 20px; cursor: pointer; accent-color: #bb86fc;
        }

        .btn-gerar { 
            background-color: #03dac6; color: #000; padding: 15px; border-radius: 20px; 
            font-weight: 700; font-family: 'Fredoka', sans-serif; border: none; width: 100%; 
            font-size: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: none; margin-top: 10px;
        }
        .btn-gerar:active { transform: scale(0.96); }
        .btn-desativado { background-color: #444444 !important; color: #888888 !important; pointer-events: none; box-shadow: none; }

        .container-progresso { width: 100%; display: none; flex-direction: column; gap: 5px; margin-top: 5px; }
        .texto-progresso { font-size: 12px; color: #03dac6; text-align: center; font-weight: 700; }
        .barra-fundo { width: 100%; height: 12px; background-color: #2a2a2a; border-radius: 10px; overflow: hidden; }
        .barra-preenchimento { height: 100%; width: 0%; background-color: #bb86fc; border-radius: 10px; transition: width 0.1s linear; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
</head>
<body>
    <div class="container">
        <h1>✨ Criador de animações de boot✨</h1>
        <p>Crie sua animação de boot com facilidade!</p>

        <label for="upload-video" class="btn-upload">📂 Escolher Vídeo</label>
        <input type="file" id="upload-video" accept="video/*" hidden>

        <div class="video-container" id="video-container">
            <video id="player-video" playsinline class="pausado"></video>
            <p class="dica-video">👆 Clique no vídeo para dar Play ou Pausar!</p>
        </div>

        <div class="timeline-wrapper" id="timeline-wrapper">
            <div class="playhead-centro"></div>
            <div class="timeline-scroll" id="timeline-scroll">
                <div class="filmstrip-container">
                    <div class="pad-spacer" id="pad-left"></div>
                    <div class="filmstrip" id="filmstrip"></div>
                    <div class="pad-spacer" id="pad-right"></div>
                </div>
            </div>
        </div>

        <div class="grid-marcadores" id="grid-marcadores">
            <button class="btn-marc btn-m0" onclick="marcarTrecho('m0')">📍 1. Início<span class="status-marc" id="st-m0">Não marcado</span></button>
            <button class="btn-marc btn-m1" onclick="marcarTrecho('m1')">✂️ 2. Fim Início<span class="status-marc" id="st-m1">Não marcado</span></button>
            <button class="btn-marc btn-m2" onclick="marcarTrecho('m2')">🔁 3. Fim Loop<span class="status-marc" id="st-m2">Não marcado</span></button>
            <button class="btn-marc btn-m3" onclick="marcarTrecho('m3')">🏁 4. Final<span class="status-marc" id="st-m3">Não marcado</span></button>
        </div>

        <div class="configuracoes" id="configuracoes">
            <div class="campo campo-full">
                <label>Nome do Arquivo 📝 (Sem .zip)</label>
                <input type="text" id="input-nome" value="bootanimation" placeholder="Ex: minha_animacao_boot">
            </div>

            <div class="campo campo-full">
                <div class="checkbox-container">
                    <label style="margin:0;">Gerar Preview em .GIF? 🖼️</label>
                    <input type="checkbox" id="input-gerar-gif" checked>
                </div>
            </div>

            <div class="campo campo-full">
                <label>Formato dos Frames 🖼️</label>
                <select id="input-formato">
                    <option value="jpeg" selected>JPEG (Android 10+ Mais leve!) 🌟</option>
                    <option value="png">PNG (Padrão pesado) 🐢</option>
                </select>
            </div>
            <div class="campo campo-full">
                <label>Resolução 📉</label>
                <select id="input-qualidade">
                    <option value="320">Ultra Leve (Batata! 320p)</option>
                    <option value="480" selected>Leve (Recomendado! 480p)</option>
                    <option value="720">Média (Pesado! 720p)</option>
                    <option value="1">Original (Gigante!)</option>
                </select>
            </div>
            <div class="campo campo-full">
                <label>Velocidade (FPS) 🎬</label>
                <input type="number" id="input-fps" value="24" min="1" max="60">
            </div>
            <div class="campo"><label>Largura</label><input type="number" id="input-largura" readonly></div>
            <div class="campo"><label>Altura</label><input type="number" id="input-altura" readonly></div>
        </div>

        <button id="btn-gerar" class="btn-gerar btn-desativado">Faltam Marcadores...</button>
        
        <div class="container-progresso" id="container-progresso">
            <div class="texto-progresso" id="texto-progresso">0%</div>
            <div class="barra-fundo"><div class="barra-preenchimento" id="barra-preenchimento"></div></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const inputVideo = document.getElementById('upload-video');
        const playerVideo = document.getElementById('player-video');
        const videoContainer = document.getElementById('video-container');
        const timelineWrapper = document.getElementById('timeline-wrapper');
        const scrollTimeline = document.getElementById('timeline-scroll');
        const filmstrip = document.getElementById('filmstrip');
        const gridMarcadores = document.getElementById('grid-marcadores');
        const configuracoes = document.getElementById('configuracoes');
        const btnGerar = document.getElementById('btn-gerar');
        
        const canvasInvisivel = document.createElement('canvas');
        const contexto = canvasInvisivel.getContext('2d', { alpha: false, willReadFrequently: true }); 
        
        let marcadores = { m0: null, m1: null, m2: null, m3: null };
        let originalW = 0, originalH = 0;
        let isDraggingTimeline = false;

        playerVideo.addEventListener('click', () => {
            if (playerVideo.paused) { playerVideo.play(); playerVideo.classList.remove('pausado'); } 
            else { playerVideo.pause(); playerVideo.classList.add('pausado'); }
        });

        playerVideo.addEventListener('pause', () => playerVideo.classList.add('pausado'));
        playerVideo.addEventListener('play', () => playerVideo.classList.remove('pausado'));

        function ajustarPaddings() {
            const pad = (timelineWrapper.clientWidth / 2) + "px";
            document.getElementById('pad-left').style.minWidth = pad;
            document.getElementById('pad-right').style.minWidth = pad;
        }
        window.addEventListener('resize', ajustarPaddings);

        inputVideo.addEventListener('change', function(evento) {
            const arquivo = evento.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                playerVideo.src = e.target.result; 
                videoContainer.style.display = 'block';
                timelineWrapper.style.display = 'block';
                gridMarcadores.style.display = 'grid';
                configuracoes.style.display = 'grid';
                btnGerar.style.display = 'block';
                
                marcadores = { m0: null, m1: null, m2: null, m3: null };
                atualizarBotoesELinhas();
            };
            leitor.readAsDataURL(arquivo);
        });

        playerVideo.addEventListener('loadedmetadata', async function() {
            originalW = playerVideo.videoWidth;
            originalH = playerVideo.videoHeight;
            atualizarTamanho();
            ajustarPaddings();
            
            document.getElementById('texto-progresso').textContent = "Carregando a Timeline... ⌛";
            document.getElementById('container-progresso').style.display = 'flex';
            await desenharFilmstrip();
            document.getElementById('container-progresso').style.display = 'none';
        });

        // 🖱️ MAGIA DO ARRASTE COM O MOUSE (PC) E TOQUE (CELULAR) ✨
        let isMouseDown = false;
        let startX;
        let scrollLeftPos;

        // Celular
        scrollTimeline.addEventListener('touchstart', () => { isDraggingTimeline = true; playerVideo.pause(); }, {passive: true});
        window.addEventListener('touchend', () => { isDraggingTimeline = false; });
        
        // PC (Mouse Normal)
        scrollTimeline.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            isDraggingTimeline = true;
            playerVideo.pause();
            startX = e.pageX - scrollTimeline.offsetLeft;
            scrollLeftPos = scrollTimeline.scrollLeft;
            scrollTimeline.style.cursor = 'grabbing';
        });

        scrollTimeline.addEventListener('mouseleave', () => {
            isMouseDown = false;
            isDraggingTimeline = false;
            scrollTimeline.style.cursor = 'grab';
        });

        window.addEventListener('mouseup', () => {
            isMouseDown = false;
            isDraggingTimeline = false;
            scrollTimeline.style.cursor = 'grab';
        });

        scrollTimeline.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            e.preventDefault();
            const x = e.pageX - scrollTimeline.offsetLeft;
            const walk = (x - startX) * 1.5; // Velocidade do deslize
            scrollTimeline.scrollLeft = scrollLeftPos - walk;
        });

        // A Timeline atualiza o vídeo!
        scrollTimeline.addEventListener('scroll', () => {
            if (!isDraggingTimeline || !playerVideo.duration) return;
            const scrollMax = filmstrip.offsetWidth;
            let percent = scrollTimeline.scrollLeft / scrollMax;
            percent = Math.max(0, Math.min(1, percent));
            playerVideo.currentTime = percent * playerVideo.duration;
        });

        playerVideo.addEventListener('timeupdate', () => {
            if (isDraggingTimeline || !playerVideo.duration) return;
            const percent = playerVideo.currentTime / playerVideo.duration;
            scrollTimeline.scrollLeft = percent * filmstrip.offsetWidth;
        });

        async function desenharFilmstrip() {
            filmstrip.innerHTML = '';
            const dur = playerVideo.duration;
            const numFrames = Math.max(5, Math.min(Math.floor(dur), 20)); 
            const larguraFrame = 60; 
            filmstrip.style.width = (numFrames * larguraFrame) + 'px';
            
            canvasInvisivel.width = 100;
            canvasInvisivel.height = Math.floor((originalH / originalW) * 100);
            
            for (let i = 0; i < numFrames; i++) {
                playerVideo.currentTime = (i / numFrames) * dur;
                await new Promise(r => {
                    const cb = () => { playerVideo.removeEventListener('seeked', cb); r(); };
                    playerVideo.addEventListener('seeked', cb);
                });
                contexto.drawImage(playerVideo, 0, 0, canvasInvisivel.width, canvasInvisivel.height);
                
                const img = document.createElement('img');
                img.src = canvasInvisivel.toDataURL('image/jpeg', 0.5);
                img.style.width = (100 / numFrames) + '%';
                filmstrip.appendChild(img);
            }
            playerVideo.currentTime = 0;
            scrollTimeline.scrollLeft = 0;
        }

        window.marcarTrecho = function(id) {
            marcadores[id] = playerVideo.currentTime;
            atualizarBotoesELinhas();
        }

        function atualizarBotoesELinhas() {
            document.querySelectorAll('.linha-marcador').forEach(el => el.remove());

            let tudoMarcado = true;
            let temposOrdem = [];

            ['m0', 'm1', 'm2', 'm3'].forEach(id => {
                const tempo = marcadores[id];
                const spanStatus = document.getElementById(`st-${id}`);
                
                if (tempo !== null) {
                    spanStatus.textContent = tempo.toFixed(2) + 's';
                    temposOrdem.push(tempo);
                    
                    const linha = document.createElement('div');
                    linha.className = `linha-marcador linha-${id}`;
                    linha.style.left = ((tempo / playerVideo.duration) * 100) + '%';
                    filmstrip.appendChild(linha);
                } else {
                    spanStatus.textContent = "Não marcado";
                    tudoMarcado = false;
                }
            });

            if (tudoMarcado) {
                if (temposOrdem[0] <= temposOrdem[1] && temposOrdem[1] <= temposOrdem[2] && temposOrdem[2] <= temposOrdem[3]) {
                    btnGerar.classList.remove('btn-desativado');
                    btnGerar.textContent = "🚀 GERAR ANIMAÇÃO DE BOOT";
                } else {
                    btnGerar.classList.add('btn-desativado');
                    btnGerar.textContent = "⚠️ Ordem errada! O Início (1) deve vir antes do Fim (4)!";
                }
            } else {
                btnGerar.classList.add('btn-desativado');
                btnGerar.textContent = "Faltam Marcadores...";
            }
        }

        document.getElementById('input-qualidade').addEventListener('change', atualizarTamanho);
        function atualizarTamanho() {
            if (!originalW || !originalH) return;
            let val = document.getElementById('input-qualidade').value;
            let w = originalW; let h = originalH;

            if (val === "320" && originalW > 320) { w = 320; h = Math.floor(originalH * (320/originalW)); } 
            else if (val === "480" && originalW > 480) { w = 480; h = Math.floor(originalH * (480/originalW)); } 
            else if (val === "720" && originalW > 720) { w = 720; h = Math.floor(originalH * (720/originalW)); }

            w = Math.floor(w / 2) * 2; h = Math.floor(h / 2) * 2;
            document.getElementById('input-largura').value = w; document.getElementById('input-altura').value = h;
        }

        btnGerar.addEventListener('click', async () => {
            if (btnGerar.classList.contains('btn-desativado')) return;
            
            btnGerar.classList.add('btn-desativado');
            btnGerar.textContent = "Gerando frames... ⌛";
            document.getElementById('container-progresso').style.display = 'flex'; 
            
            try {
                const zip = new JSZip();
                // Limita o FPS até o 60 pra não dar ruim! owo
                let fps = parseInt(document.getElementById('input-fps').value) || 24;
                fps = Math.min(60, Math.max(1, fps));

                const largura = parseInt(document.getElementById('input-largura').value);
                const altura = parseInt(document.getElementById('input-altura').value);
                const formato = document.getElementById('input-formato').value;
                
                let nomeEscolhido = document.getElementById('input-nome').value.trim();
                if (!nomeEscolhido) nomeEscolhido = "bootanimation";
                
                const deveGerarGif = document.getElementById('input-gerar-gif').checked;

                canvasInvisivel.width = largura; canvasInvisivel.height = altura;

                await paparazzoDaTimeline(zip, largura, altura, fps, formato, deveGerarGif, nomeEscolhido);

                zip.file("desc.txt", `${largura} ${altura} ${fps}\np 1 0 part0\np 0 0 part1\np 1 0 part2\n`);
                
                document.getElementById('texto-progresso').textContent = "Compactando o .ZIP... (Aguarde!)";
                btnGerar.textContent = "Fechando o zíper... 📦";
                
                const conteudoZip = await zip.generateAsync({ type: "blob", compression: "STORE" });
                
                const linkDownload = document.createElement("a");
                linkDownload.href = URL.createObjectURL(conteudoZip);
                linkDownload.download = `${nomeEscolhido}.zip`; 
                linkDownload.click();
                
            } catch (erro) {
                console.error(erro);
                btnGerar.textContent = "Aconteceu um erro ❌";
                document.getElementById('texto-progresso').style.color = "#ff5555";
            }
        });

        async function paparazzoDaTimeline(zip, largura, altura, fps, formato, deveGerarGif, nomeEscolhido) {
            const pasta0 = zip.folder("part0"), pasta1 = zip.folder("part1"), pasta2 = zip.folder("part2");
            let c0 = 0, c1 = 0, c2 = 0, fotosTiradas = 0;
            const intervalo = 1 / fps;
            const totalFotos = Math.floor((marcadores.m3 - marcadores.m0) / intervalo) + 1;
            const mimeType = formato === 'jpeg' ? 'image/jpeg' : 'image/png';
            const extensao = formato === 'jpeg' ? '.jpg' : '.png';

            let gif = null;
            let canvasGif = null, ctxGif = null;
            let gifW = 250; 
            let gifH = 250;

            if (deveGerarGif) {
                document.getElementById('texto-progresso').textContent = "Iniciando motor de GIF... ⚙️";
                try {
                    const workerBlob = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js').then(r => r.blob());
                    gifH = Math.floor(altura * (250 / largura));
                    
                    gif = new GIF({
                        workers: 2,
                        quality: 10,
                        width: gifW,
                        height: gifH,
                        workerScript: URL.createObjectURL(workerBlob)
                    });

                    canvasGif = document.createElement('canvas');
                    canvasGif.width = gifW;
                    canvasGif.height = gifH;
                    ctxGif = canvasGif.getContext('2d', { alpha: false });
                } catch(e) { console.error("Erro no motor de GIF", e); gif = null; }
            }

            playerVideo.pause();

            for (let tempo = marcadores.m0; tempo <= marcadores.m3; tempo += intervalo) {
                playerVideo.currentTime = tempo;
                await new Promise(resolve => {
                    const cb = () => { playerVideo.removeEventListener('seeked', cb); resolve(); };
                    playerVideo.addEventListener('seeked', cb);
                });

                contexto.fillStyle = "#000000";
                contexto.fillRect(0, 0, largura, altura);
                contexto.drawImage(playerVideo, 0, 0, largura, altura);

                let pastaAlvo = null; let numFoto = 0;
                if (tempo < marcadores.m1) { pastaAlvo = pasta0; numFoto = c0++; } 
                else if (tempo < marcadores.m2) { pastaAlvo = pasta1; numFoto = c1++; } 
                else { pastaAlvo = pasta2; numFoto = c2++; }

                const nome = String(numFoto).padStart(5, '0') + extensao;
                const blob = await new Promise(res => canvasInvisivel.toBlob(res, mimeType, 0.8));
                if (blob) pastaAlvo.file(nome, blob);

                if (deveGerarGif && gif && ctxGif) {
                    ctxGif.fillStyle = "#000000";
                    ctxGif.fillRect(0, 0, gifW, gifH);
                    ctxGif.drawImage(playerVideo, 0, 0, gifW, gifH);
                    gif.addFrame(ctxGif, {delay: Math.round(1000 / fps), copy: true});
                }

                fotosTiradas++;
                const porcentagem = Math.min(100, Math.floor((fotosTiradas / totalFotos) * 100));
                document.getElementById('barra-preenchimento').style.width = porcentagem + '%';
                document.getElementById('texto-progresso').textContent = `Criando... ${fotosTiradas}/${totalFotos} (${porcentagem}%)`;
            }

            if (deveGerarGif && gif) {
                document.getElementById('texto-progresso').textContent = "Renderizando Preview em GIF... 🎬 (Pode demorar um tiquinho!)";
                btnGerar.textContent = "Gerando GIF... 🖼️";
                
                return new Promise((resolve) => {
                    gif.on('progress', p => {
                        const pct = Math.round(p * 100);
                        document.getElementById('barra-preenchimento').style.width = pct + '%';
                        document.getElementById('texto-progresso').textContent = `Processando GIF... ${pct}% :3`;
                    });
                    
                    gif.on('finished', function(blob) {
                        const linkGif = document.createElement("a");
                        linkGif.href = URL.createObjectURL(blob);
                        linkGif.download = `${nomeEscolhido}.gif`;
                        linkGif.click();
                        resolve();
                    });
                    gif.render();
                });
            }
        }
    </script>
</body>
</html>
